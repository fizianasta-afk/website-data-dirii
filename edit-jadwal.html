<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Jadwal Pelajaran</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 18px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;

            border: 1px solid #cbd5e1;
            border-radius: 9px;

            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;

            border: none;
            border-radius: 10px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .hapus {
            background: #dc2626;
        }

        .hapus:hover {
            background: #b91c1c;
        }

        .kembali {
            background: #64748b;
        }

        .kembali:hover {
            background: #475569;
        }

        .hari {
            margin-top: 20px;
            padding: 20px;

            background: #f8fafc;

            border-radius: 15px;
        }

        .hari h3 {
            margin-top: 0;
            color: #2563eb;
        }

        .jadwal-item {
            background: white;
            padding: 15px;

            margin-top: 12px;

            border-radius: 12px;

            border:
                1px solid
                #e2e8f0;
        }

        .jadwal-item strong {
            font-size: 18px;
        }

        .detail {
            color: #64748b;
            margin-top: 7px;
        }

        .aksi {
            display: flex;
            gap: 10px;
        }

        .aksi button {
            margin-top: 12px;
        }

        .kosong {
            color: #64748b;
        }

        #login {
            max-width: 500px;
            margin: auto;
        }

        #editor {
            display: none;
        }

    </style>

</head>


<body>


<header>

    <h1>⚙️ Edit Jadwal Pelajaran</h1>

    <p>
        Atur jadwal sesuai jadwal sekolahmu
    </p>

</header>


<div class="container">


    <!-- =========================
         LOGIN
    ========================== -->

    <div
        class="card"
        id="login">

        <h2>🔐 Masukkan PIN</h2>

        <p>
            Gunakan PIN yang kamu buat
            saat mengisi data diri.
        </p>

        <input
            type="password"
            id="pin"
            placeholder="Masukkan PIN">

        <button onclick="cekPIN()">
            🔓 Masuk
        </button>

        <button
            class="kembali"
            onclick="kembali()">

            🏠 Kembali

        </button>

    </div>



    <!-- =========================
         EDITOR
    ========================== -->

    <div id="editor">


        <!-- FORM -->

        <div class="card">

            <h2>➕ Tambah Jadwal</h2>


            <label>
                📅 Hari
            </label>

            <select id="hari">

                <option value="senin">
                    Senin
                </option>

                <option value="selasa">
                    Selasa
                </option>

                <option value="rabu">
                    Rabu
                </option>

                <option value="kamis">
                    Kamis
                </option>

                <option value="jumat">
                    Jumat
                </option>

            </select>


            <label>
                🕐 Jam Mulai
            </label>

            <input
                type="time"
                id="mulai">


            <label>
                🕑 Jam Selesai
            </label>

            <input
                type="time"
                id="selesai">


            <label>
                📚 Mata Pelajaran
            </label>

            <input
                type="text"
                id="pelajaran"
                placeholder="Contoh: Matematika">


            <label>
                👨‍🏫 Nama Guru
            </label>

            <input
                type="text"
                id="guru"
                placeholder="Contoh: Pak Budi">


            <label>
                🚪 Ruang Kelas
            </label>

            <input
                type="text"
                id="ruang"
                placeholder="Contoh: Kelas 9A">


            <button onclick="tambahJadwal()">

                ➕ Tambahkan Jadwal

            </button>

        </div>



        <!-- =========================
             DAFTAR
        ========================== -->

        <div class="card">

            <h2>
                📅 Jadwal Saat Ini
            </h2>

            <div id="daftar"></div>

        </div>



        <button onclick="simpan()">

            💾 Simpan Jadwal

        </button>


        <button
            class="kembali"
            onclick="kembali()">

            🏠 Kembali

        </button>


    </div>

</div>



<script>


let jadwal = {

    senin: [],
    selasa: [],
    rabu: [],
    kamis: [],
    jumat: []

};


const hariList = [
    "senin",
    "selasa",
    "rabu",
    "kamis",
    "jumat"
];


// ==========================
// CEK PIN
// ==========================

function cekPIN() {

    const pin =
        document.getElementById(
            "pin"
        ).value;

    const pinBenar =
        localStorage.getItem(
            "pin"
        );


    if (!pinBenar) {

        alert(
            "⚠️ Silakan isi data diri dan buat PIN terlebih dahulu."
        );

        return;

    }


    if (pin === pinBenar) {

        document.getElementById(
            "login"
        ).style.display =
            "none";

        document.getElementById(
            "editor"
        ).style.display =
            "block";

        ambilJadwal();

    } else {

        alert(
            "❌ PIN salah!"
        );

    }

}


// ==========================
// AMBIL JADWAL
// ==========================

function ambilJadwal() {

    const data =
        localStorage.getItem(
            "jadwal"
        );


    if (data) {

        jadwal =
            JSON.parse(data);

    }


    hariList.forEach(hari => {

        if (!jadwal[hari]) {

            jadwal[hari] = [];

        }

    });


    tampilkan();

}


// ==========================
// TAMBAH
// ==========================

function tambahJadwal() {

    const hari =
        document.getElementById(
            "hari"
        ).value;

    const mulai =
        document.getElementById(
            "mulai"
        ).value;

    const selesai =
        document.getElementById(
            "selesai"
        ).value;

    const pelajaran =
        document.getElementById(
            "pelajaran"
        ).value.trim();

    const guru =
        document.getElementById(
            "guru"
        ).value.trim();

    const ruang =
        document.getElementById(
            "ruang"
        ).value.trim();


    if (
        mulai === "" ||
        selesai === "" ||
        pelajaran === "" ||
        guru === "" ||
        ruang === ""
    ) {

        alert(
            "⚠️ Semua data harus diisi!"
        );

        return;

    }


    if (mulai >= selesai) {

        alert(
            "⚠️ Jam selesai harus lebih besar dari jam mulai."
        );

        return;

    }


    jadwal[hari].push({

        mulai: mulai,

        selesai: selesai,

        pelajaran: pelajaran,

        guru: guru,

        ruang: ruang

    });


    jadwal[hari].sort(
        (a, b) =>
            a.mulai.localeCompare(
                b.mulai
            )
    );


    document.getElementById(
        "mulai"
    ).value = "";

    document.getElementById(
        "selesai"
    ).value = "";

    document.getElementById(
        "pelajaran"
    ).value = "";

    document.getElementById(
        "guru"
    ).value = "";

    document.getElementById(
        "ruang"
    ).value = "";


    tampilkan();

}


// ==========================
// TAMPILKAN
// ==========================

function tampilkan() {

    const container =
        document.getElementById(
            "daftar"
        );


    container.innerHTML = "";


    hariList.forEach(hari => {

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "hari";


        const judul =
            document.createElement(
                "h3"
            );

        judul.textContent =
            hari.toUpperCase();


        div.appendChild(
            judul
        );


        if (
            jadwal[hari].length === 0
        ) {

            const kosong =
                document.createElement(
                    "p"
                );

            kosong.className =
                "kosong";

            kosong.textContent =
                "Belum ada jadwal.";

            div.appendChild(
                kosong
            );

        }


        jadwal[hari].forEach(
            (item, index) => {


                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "jadwal-item";


                row.innerHTML = `

                    <strong>
                        🕐 ${item.mulai}
                        -
                        ${item.selesai}
                    </strong>

                    <div>
                        📚 ${item.pelajaran}
                    </div>

                    <div class="detail">

                        👨‍🏫 ${item.guru}

                        <br>

                        🚪 ${item.ruang}

                    </div>

                    <div class="aksi">

                        <button
                            class="hapus"
                            onclick="
                            hapusJadwal(
                                '${hari}',
                                ${index}
                            )">

                            🗑️ Hapus

                        </button>

                    </div>

                `;


                div.appendChild(
                    row
                );

            }
        );


        container.appendChild(
            div
        );

    });

}


// ==========================
// HAPUS
// ==========================

function hapusJadwal(
    hari,
    index
) {

    if (
        confirm(
            "Hapus jadwal ini?"
        )
    ) {

        jadwal[hari].splice(
            index,
            1
        );

        tampilkan();

    }

}


// ==========================
// SIMPAN
// ==========================

function simpan() {

    localStorage.setItem(
        "jadwal",
        JSON.stringify(
            jadwal
        )
    );


    alert(
        "✅ Jadwal berhasil disimpan!"
    );


    window.location.href =
        "jadwal.html";

}


// ==========================
// KEMBALI
// ==========================

function kembali() {

    window.location.href =
        "index.html";

}

</script>


</body>

</html>
