<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jadwal Pelajaran</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background: #f1f5f9;

            color: #1e293b;

        }


        header {

            background:
                linear-gradient(
                    135deg,
                    #059669,
                    #10b981
                );

            color: white;

            text-align: center;

            padding: 35px 20px;

        }


        header h1 {

            margin: 0;

        }


        .container {

            max-width: 1000px;

            margin: 30px auto;

            padding: 20px;

        }


        .card {

            background: white;

            padding: 25px;

            margin-bottom: 20px;

            border-radius: 18px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.08);

        }


        .hari {

            margin-top: 20px;

            padding: 20px;

            background: #f8fafc;

            border-radius: 15px;

        }


        .hari h2 {

            margin-top: 0;

            color: #059669;

        }


        .jadwal-item {

            background: white;

            padding: 17px;

            margin-top: 12px;

            border-radius: 12px;

            border:
                1px solid
                #e2e8f0;

        }


        .jam {

            font-weight: bold;

            color: #059669;

            font-size: 17px;

        }


        .mapel {

            font-size: 19px;

            font-weight: bold;

            margin-top: 7px;

        }


        .detail {

            color: #64748b;

            margin-top: 7px;

            line-height: 1.6;

        }


        button {

            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: none;

            border-radius: 10px;

            background: #059669;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #047857;

        }


        .kembali {

            background: #64748b;

        }


        .kembali:hover {

            background: #475569;

        }


    </style>

</head>


<body>


<header>

    <h1>
        📅 Jadwal Pelajaran
    </h1>

    <p>
        Jadwal sekolah saya
    </p>

</header>



<div class="container">


    <div class="card">

        <div id="jadwal"></div>

    </div>


    <button
        onclick="edit()">

        ⚙️ Edit Jadwal

    </button>


    <button
        class="kembali"
        onclick="kembali()">

        🏠 Kembali

    </button>


</div>



<script>


const hariList = [

    "senin",
    "selasa",
    "rabu",
    "kamis",
    "jumat"

];


let jadwal = {

    senin: [],
    selasa: [],
    rabu: [],
    kamis: [],
    jumat: []

};


const data =
    localStorage.getItem(
        "jadwal"
    );


if (data) {

    jadwal =
        JSON.parse(data);

}



function tampilkan() {

    const container =
        document.getElementById(
            "jadwal"
        );


    container.innerHTML = "";


    hariList.forEach(
        hari => {


        const div =
            document.createElement(
                "div"
            );

        div.className =
            "hari";


        const judul =
            document.createElement(
                "h2"
            );

        judul.textContent =
            "📚 " +
            hari.charAt(0)
                .toUpperCase()
            +
            hari.slice(1);


        div.appendChild(
            judul
        );


        const dataHari =
            jadwal[hari] || [];


        if (
            dataHari.length === 0
        ) {

            const kosong =
                document.createElement(
                    "p"
                );

            kosong.textContent =
                "Belum ada jadwal.";

            div.appendChild(
                kosong
            );

        }


        dataHari.forEach(
            item => {


            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "jadwal-item";


            row.innerHTML = `

                <div class="jam">

                    🕐 ${item.mulai}
                    -
                    ${item.selesai}

                </div>

                <div class="mapel">

                    📚 ${item.pelajaran}

                </div>

                <div class="detail">

                    👨‍🏫 Guru:
                    ${item.guru}

                    <br>

                    🚪 Ruang:
                    ${item.ruang}

                </div>

            `;


            div.appendChild(
                row
            );

        });


        container.appendChild(
            div
        );


    });

}



function edit() {

    window.location.href =
        "edit-jadwal.html";

}


function kembali() {

    window.location.href =
        "index.html";

}


tampilkan();


</script>


</body>

</html>
