<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hasil Karya Excel</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;

            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;

            margin-top: 15px;

            border: none;
            border-radius: 10px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .hapus {
            background: #dc2626;
        }

        .hapus:hover {
            background: #b91c1c;
        }

        .kembali {
            background: #64748b;
        }

        .kembali:hover {
            background: #475569;
        }

        .karya {
            padding: 20px;
            margin-top: 15px;

            background: #f8fafc;

            border-radius: 12px;
        }

        .karya h3 {
            margin-top: 0;
        }

        .link-karya {
            display: block;

            padding: 12px;

            margin-top: 10px;

            background: #e0e7ff;

            border-radius: 8px;

            color: #1d4ed8;

            text-decoration: none;

            word-break: break-all;
        }

        .kosong {
            text-align: center;
            color: #666;
        }

    </style>

</head>


<body>


<header>

    <h1>📊 Hasil Karya Excel</h1>

    <p>
        Tempat menyimpan hasil karya Excel kamu
    </p>

</header>


<div class="container">


    <!-- FORM TAMBAH -->

    <div class="card">

        <h2>➕ Tambah Hasil Karya</h2>

        <label>
            Judul Karya
        </label>

        <input
            type="text"
            id="judul"
            placeholder="Contoh: Tabel Nilai Siswa">


        <label>
            Deskripsi
        </label>

        <textarea
            id="deskripsi"
            placeholder="Jelaskan tentang karya kamu">
        </textarea>


        <label>
            Link File Excel
        </label>

        <input
            type="url"
            id="link"
            placeholder="https://drive.google.com/...">


        <button onclick="tambahKarya()">

            ➕ Tambahkan Karya

        </button>

    </div>


    <!-- DAFTAR KARYA -->

    <div class="card">

        <h2>📁 Karya Saya</h2>

        <div id="daftarKarya"></div>

    </div>


    <button
        class="kembali"
        onclick="kembali()">

        🏠 Kembali

    </button>


</div>


<script>


let karya = [];


// ==========================
// AMBIL DATA
// ==========================

function ambilKarya() {

    const data =
        localStorage.getItem("karyaExcel");


    if (data) {

        karya =
            JSON.parse(data);

    } else {

        karya = [];

    }


    tampilkanKarya();

}


// ==========================
// TAMBAH KARYA
// ==========================

function tambahKarya() {

    const judul =
        document.getElementById("judul").value.trim();

    const deskripsi =
        document.getElementById("deskripsi").value.trim();

    const link =
        document.getElementById("link").value.trim();


    if (
        judul === "" ||
        deskripsi === "" ||
        link === ""
    ) {

        alert(
            "⚠️ Semua bagian harus diisi!"
        );

        return;

    }


    karya.push({

        id: Date.now(),

        judul: judul,

        deskripsi: deskripsi,

        link: link

    });


    localStorage.setItem(
        "karyaExcel",
        JSON.stringify(karya)
    );


    document.getElementById("judul").value = "";

    document.getElementById("deskripsi").value = "";

    document.getElementById("link").value = "";


    tampilkanKarya();


    alert(
        "✅ Hasil karya berhasil ditambahkan!"
    );

}


// ==========================
// TAMPILKAN KARYA
// ==========================

function tampilkanKarya() {

    const container =
        document.getElementById("daftarKarya");


    container.innerHTML = "";


    if (karya.length === 0) {

        container.innerHTML = `

            <p class="kosong">

                📂 Belum ada hasil karya.

            </p>

        `;

        return;

    }


    karya.forEach(item => {

        const div =
            document.createElement("div");

        div.className =
            "karya";


        div.innerHTML = `

            <h3>
                📊 ${item.judul}
            </h3>

            <p>
                ${item.deskripsi}
            </p>

            <a
                class="link-karya"
                href="${item.link}"
                target="_blank">

                🔗 Buka File Excel

            </a>

            <button
                class="hapus"
                onclick="hapusKarya(${item.id})">

                🗑️ Hapus Karya

            </button>

        `;


        container.appendChild(div);

    });

}


// ==========================
// HAPUS
// ==========================

function hapusKarya(id) {

    if (
        confirm(
            "Yakin ingin menghapus karya ini?"
        )
    ) {

        karya =
            karya.filter(
                item => item.id !== id
            );


        localStorage.setItem(
            "karyaExcel",
            JSON.stringify(karya)
        );


        tampilkanKarya();

    }

}


// ==========================
// KEMBALI
// ==========================

function kembali() {

    window.location.href =
        "index.html";

}


ambilKarya();


</script>


</body>

</html>
