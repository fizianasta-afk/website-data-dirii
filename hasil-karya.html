<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Hasil Karya Excel</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ede9fe,
                    #f8fafc
                );

            min-height: 100vh;

            color: #1e293b;

        }


        header {

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #8b5cf6
                );

            color: white;

            text-align: center;

            padding: 40px 20px;

        }


        header h1 {

            margin: 0;

            font-size: 32px;

        }


        header p {

            margin-bottom: 0;

            opacity: 0.9;

        }


        .container {

            max-width: 900px;

            margin: 30px auto;

            padding: 20px;

        }


        .card {

            background: white;

            border-radius: 20px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow:
                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

        }


        .upload {

            border:
                2px dashed
                #a78bfa;

            border-radius: 15px;

            padding: 35px 20px;

            text-align: center;

            background: #faf5ff;

        }


        .upload-icon {

            font-size: 55px;

            margin-bottom: 10px;

        }


        input[type="file"] {

            width: 100%;

            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            border:
                1px solid
                #cbd5e1;

            background: white;

        }


        button {

            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: none;

            border-radius: 10px;

            background: #7c3aed;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #6d28d9;

        }


        .kembali {

            background: #64748b;

        }


        .kembali:hover {

            background: #475569;

        }


        .file-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding: 18px;

            margin-top: 12px;

            border:
                1px solid
                #e2e8f0;

            border-radius: 12px;

            background: #f8fafc;

        }


        .file-info {

            flex: 1;

        }


        .file-name {

            font-weight: bold;

            font-size: 17px;

            word-break: break-word;

        }


        .file-size {

            color: #64748b;

            font-size: 13px;

            margin-top: 5px;

        }


        .file-actions {

            display: flex;

            gap: 8px;

        }


        .file-actions button {

            width: auto;

            margin: 0;

            padding:
                10px 14px;

        }


        .hapus {

            background: #dc2626;

        }


        .hapus:hover {

            background: #b91c1c;

        }


        .kosong {

            text-align: center;

            color: #64748b;

            padding: 25px;

        }


        @media (
            max-width: 600px
        ) {

            .file-item {

                flex-direction: column;

                align-items: stretch;

            }


            .file-actions {

                flex-direction: column;

            }


            .file-actions button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        📊 Hasil Karya Excel
    </h1>

    <p>
        Simpan dan lihat hasil karya Excel kamu
    </p>

</header>



<div class="container">


    <!-- ======================
         UPLOAD
    ======================= -->

    <div class="card">

        <h2>
            📁 Tambahkan Karya
        </h2>


        <div class="upload">

            <div class="upload-icon">
                📊
            </div>


            <p>
                Pilih file Excel dari komputer
            </p>


            <input
                type="file"
                id="fileExcel"
                accept=".xlsx,.xls,.csv">


            <button
                onclick="simpanFile()">

                💾 Simpan Karya

            </button>

        </div>

    </div>



    <!-- ======================
         DAFTAR FILE
    ======================= -->

    <div class="card">

        <h2>
            📚 Karya Saya
        </h2>


        <div id="daftarFile">

        </div>

    </div>



    <button
        class="kembali"
        onclick="kembali()">

        🏠 Kembali ke Beranda

    </button>


</div>



<script>


// ==================================
// AMBIL FILE YANG TERSIMPAN
// ==================================


let fileKarya =
    JSON.parse(
        localStorage.getItem(
            "fileKarya"
        )
    ) || [];


// ==================================
// SIMPAN FILE
// ==================================


function simpanFile() {


    const input =
        document.getElementById(
            "fileExcel"
        );


    const file =
        input.files[0];


    if (!file) {

        alert(
            "⚠️ Pilih file Excel terlebih dahulu!"
        );

        return;

    }


    // Batas ukuran sederhana
    // agar localStorage tidak cepat penuh

    const batas =
        3 * 1024 * 1024;


    if (file.size > batas) {

        alert(
            "⚠️ File terlalu besar. " +
            "Gunakan file maksimal sekitar 3 MB."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {


        const data =
            e.target.result;


        fileKarya.push({

            nama:
                file.name,

            ukuran:
                file.size,

            tipe:
                file.type,

            data:
                data

        });


        localStorage.setItem(

            "fileKarya",

            JSON.stringify(
                fileKarya
            )

        );


        input.value = "";


        tampilkanFile();


        alert(
            "✅ Karya berhasil disimpan!"
        );

    };


    reader.readAsDataURL(file);

}


// ==================================
// TAMPILKAN FILE
// ==================================


function tampilkanFile() {


    const container =
        document.getElementById(
            "daftarFile"
        );


    container.innerHTML = "";


    if (
        fileKarya.length === 0
    ) {

        container.innerHTML = `

            <div class="kosong">

                📭 Belum ada hasil karya.

                <br><br>

                Silakan tambahkan
                file Excel kamu.

            </div>

        `;

        return;

    }


    fileKarya.forEach(
        (file, index) => {


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "file-item";


        div.innerHTML = `

            <div class="file-info">

                <div class="file-name">

                    📊 ${file.nama}

                </div>

                <div class="file-size">

                    ${formatUkuran(
                        file.ukuran
                    )}

                </div>

            </div>


            <div class="file-actions">

                <button
                    onclick="
                    bukaFile(${index})
                    ">

                    👀 Buka

                </button>


                <button
                    class="hapus"
                    onclick="
                    hapusFile(${index})
                    ">

                    🗑️ Hapus

                </button>

            </div>

        `;


        container.appendChild(
            div
        );

    });

}


// ==================================
// BUKA FILE
// ==================================


function bukaFile(index) {


    const file =
        fileKarya[index];


    const link =
        document.createElement(
            "a"
        );


    link.href =
        file.data;


    link.download =
        file.nama;


    link.click();

}


// ==================================
// HAPUS FILE
// ==================================


function hapusFile(index) {


    if (
        !confirm(
            "Apakah kamu yakin ingin menghapus karya ini?"
        )
    ) {

        return;

    }


    fileKarya.splice(
        index,
        1
    );


    localStorage.setItem(

        "fileKarya",

        JSON.stringify(
            fileKarya
        )

    );


    tampilkanFile();

}


// ==================================
// FORMAT UKURAN
// ==================================


function formatUkuran(bytes) {


    if (
        bytes < 1024
    ) {

        return bytes +
            " B";

    }


    if (
        bytes < 1024 * 1024
    ) {

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";

    }


    return (
        bytes /
        (1024 * 1024)
    ).toFixed(2) +
    " MB";

}


// ==================================
// KEMBALI
// ==================================


function kembali() {

    window.location.href =
        "index.html";

}


// Tampilkan ketika halaman dibuka

tampilkanFile();

</script>


</body>

</html>
